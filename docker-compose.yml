services:
  postgres:
    image: postgres:18
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sentinel_redis_data:/data

  api:
    build:
      context: ./backend
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./worker
    container_name: sentinel-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  sentinel_postgres_data:
  sentinel_redis_data: