services:
  postgres:
    image: postgres:18
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: GunaDB123
    ports:
      - "5434:5432"
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sentinel_redis_data:/data

volumes:
  sentinel_postgres_data:
  sentinel_redis_data: